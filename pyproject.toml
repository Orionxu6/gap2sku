[project]
name = "gap2sku-agentteams-demo"
version = "3.0.0"
description = "Gap2SKU decision firewall — evidence, conflict and governed product decisions"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Gap2SKU Demo Team" }]

dependencies = [
    "pydantic>=2.5,<3",
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "sse-starlette>=1.6,<3",
    "starlette>=0.31,<1",
    "uvicorn>=0.23,<1",
    "python-multipart>=0.0.6,<1",
    "anyio>=3.7,<5",
    "openpyxl>=3.1,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<7",
    "ruff>=0.1,<1",
    "mypy>=1.7,<2",
]
export = [
    "python-docx>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gap2sku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires MCP server or AgentTeams",
    "security: security and prompt-injection tests",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM108", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "F841"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disable_error_code = ["type-arg"]

[tool.coverage.run]
branch = true
source = ["src/gap2sku"]
omit = [
    "src/gap2sku/cli/*",
    "src/gap2sku/fixtures/*",
    "src/gap2sku/mcp_server.py",
    "src/gap2sku/replanning/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
